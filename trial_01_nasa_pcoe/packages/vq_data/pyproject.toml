[project]
name = "vq-data"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "vq-core",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyarrow>=14",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
