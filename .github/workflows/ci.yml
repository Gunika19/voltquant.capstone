name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      # envs/data.txt only pins pandas/pyarrow/matplotlib/pytest/ruff plus
      # the two local packages -- no NASA/EV data files are required to
      # install it or to run the tests below (packages/vq_core/tests is
      # pure unit tests against in-memory DataFrames).
      - name: Set up virtual environments
        run: |
          make env-data
          make env-classical
          make env-quantum

      - name: Run tests
        run: make test

      - name: Lint
        run: make lint
